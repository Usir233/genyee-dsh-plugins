# Employee defaults: every installation starts in the employee role and selects
# the genyee-keyhub route. An admin installation adds its own admin row in its
# profile patch; this employee row stays, so the admin's own chats use the relay.
- insert:
    - id: genyee-keyhub
      name: '@genyee/dsh-keyhub'
      config:
        role: employee

- id: agent-default-model
  config:
    provider: genyee-keyhub
    model: deepseek-flash
